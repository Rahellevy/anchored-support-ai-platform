<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logo in - Anchorde Support Services</title>
    <link rel="stylesheet" href="login.css" />
</head>

<body Class="auth-page">

    <main class="auth">

        <section class="auth__card">

            <img class="auth__logo" src="images/logo.png" alt="Anchored Support Services logo" width="160"
                height="160" />
            <from id="login-from" class="auth__form" novalidate>

                <h1 class="auth__title"> Log in </h1>
                <!--USERNAME-->
                <div class="field">
                    <lable for="username" class="visually-hidden">Username</lable>

                    <span class="field__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" heght="18" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" strok-linejoin="round">
                            <circle cx="12" cy="8" r="4" />
                            <path d="M4 21c0-4 4-6 8-6s8 2 8 6" />
                        </svg>
                    </span>
                    <input id="username" name="username" type="text" placeholder="Username" autocomplete="username"
                        required />
                </div>

                <!--PASSWORD-->
                <div class="field">
                    <label for="password" class="visually-hidden">Password</label>

                    <span class="field__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="5" y="11" width="14" height="10" rx="2" />
                            <path d="M8 11V8a4 4 0 0 1 8 0v3" />
                        </svg>
                    </span>
                    <input id="password" name="password" type="password" placeholder="Password"
                        autocomplete="current-password" required />
                    <button type="button" id="toggle-password" class="field__toggle" aria-label="Show password"
                        aria-pressed="false">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
                            <circle cx="12" cy="12" r="3" />

                            <path class="eye-slash" d="M3 3l18 18" />
                        </svg>
                    </button>
                </div>
                <div class="auth__row">

                    <label class="check">
                        <input type="checkbox" name="remember" />
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="auth__link">Forgot password?</a>
                </div>


                <p id="login-error" class="form-error" role="alert" hidden></p>


                <button type="submit" class="btn btn--primary">Log in</button>


                <p class="divider"><span>Or</span></p>


                <a href="#" class="btn btn--secondary">Sign up</a>


                <p class="auth__note">This system is not a crisis or emergency service.</p>
                </form>
        </section>
    </main>

    <script src="login.js"></script>
</body>

</html>
