services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  server:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Double underscore = nested config key (ConnectionStrings:Default)
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      OpenAI__ApiKey: ${OPENAI_API_KEY}
      OpenAI__Model: ${OPENAI_MODEL}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      
  frontend:
    build: 
      context: ./frontend
      additional_contexts:
        nginx: ./nginx
    ports:
      - "80:80"
    depends_on:
      - server
    
volumes:
  pgdata: